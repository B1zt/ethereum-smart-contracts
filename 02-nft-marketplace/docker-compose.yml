services:
  postgres:
    image: postgres:17-alpine
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The backend depends on this, so an unhealthy database should block startup rather than
      # producing a confusing connection error a few seconds in.
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  anvil:
    # Local Ethereum node with the same Foundry version the contracts are built against, so the
    # whole stack can run without a testnet faucet or an RPC key.
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: marketplace-anvil
    restart: unless-stopped
    entrypoint: ["anvil"]
    command:
      - "--host=0.0.0.0"
      - "--chain-id=31337"
      # Deterministic accounts, so the seed script and the frontend agree on who owns what.
      - "--mnemonic=test test test test test test test test test test test junk"
      # One block per 2 seconds rather than instant mining, so the indexer's confirmation window
      # behaves the way it would on a real chain.
      - "--block-time=2"
    ports:
      - "8545:8545"

volumes:
  postgres-data:
