[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
bytecode_hash = "none"
cbor_metadata = false

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[lint]
# Vesting cliffs and governance windows are measured in days. A validator nudging block.timestamp
# by a few seconds is not a meaningful attack on either.
#
# The lint gate for this project is `forge lint src`, which is clean. `forge build` also lints the
# test tree, where unchecked `transfer` return values against a known-good mock are expected.
exclude_lints = ["block-timestamp"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.lite]
optimizer = false
fuzz = {runs = 32}
invariant = {runs = 16, depth = 16}

[profile.deep]
fuzz = {runs = 10_000}
invariant = {runs = 1_000, depth = 128}

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
sort_imports = true

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
mainnet = {key = "${ETHERSCAN_API_KEY}"}
sepolia = {key = "${ETHERSCAN_API_KEY}", chain = 11155111}
