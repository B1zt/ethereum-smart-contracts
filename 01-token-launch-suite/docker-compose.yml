services:
  postgres:
    image: postgres:17-alpine
    container_name: tokensuite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokensuite
      POSTGRES_PASSWORD: tokensuite
      POSTGRES_DB: tokensuite
    # Port 5433 so this can run alongside the marketplace project's Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - tokensuite-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokensuite -d tokensuite"]
      interval: 5s
      timeout: 5s
      retries: 10

  anvil:
    # Local Ethereum node, so the whole stack runs without a faucet or an RPC key.
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: tokensuite-anvil
    restart: unless-stopped
    entrypoint: ["anvil"]
    command:
      - "--host=0.0.0.0"
      - "--chain-id=31337"
      - "--mnemonic=test test test test test test test test test test test junk"
      # Real block times rather than instant mining, so the indexer's confirmation window behaves
      # the way it would on a live chain.
      - "--block-time=2"
    ports:
      - "8545:8545"

volumes:
  tokensuite-data:
